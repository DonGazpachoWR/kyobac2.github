# wrangler.toml — Cloudflare Worker of "Clara", the Kyobac Labs website
# assistant. Deploy from this folder with: npx wrangler deploy
# Version: 1.0 · Author: Adrian Berenguer-Agustí (I2SysBio-CSIC) · Date: 2026-10-10

name = "clara"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# The .txt files (instructions and knowledge base) are imported as text.
rules = [{ type = "Text", globs = ["**/*.txt"], fallthrough = true }]

[vars]
# Workers AI model that writes Clara's answers.
MODEL = "@cf/mistralai/mistral-small-3.1-24b-instruct"
# Websites allowed to call the Worker from the browser (CORS).
ALLOWED_ORIGINS = "https://dongazpachowr.github.io,http://localhost:8000"

# Workers AI, billed in Neurons (10,000 free per day).
[ai]
binding = "AI"

# At most 10 messages per minute from the same IP address.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# No request logs: conversations must not be stored.
[observability]
enabled = false
